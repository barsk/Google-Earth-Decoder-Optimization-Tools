collider_as_lower_lod = False

[MERGE]
project_path_to_merge =
definition_file_to_merge =

[TILE]
lat_correction = 0
lon_correction = 0

[LODS]
target_min_size_values = 0, 15, 50, 70, 80, 90, 100

[OPENSTREETMAP]
airport_city =
high_precision = True
exclude_ground = True
exclude_water = True
push_down_water = True
smooth_beaches = True
exclude_forests = True
exclude_woods = True
exclude_nature_reserves = True
exclude_parks = True
isolate_3d_data = False
keep_buildings = True
keep_roads = True
keep_constructions = True
force_osm_data_download = False
keep_residential = False
process_all = False
ground_exclusion_margin = 0.0
create_forests_vegetation = False
create_woods_vegetation = False
building_margin = 8

[GEOCODE]
geocode =
geocode_margin = 5
preserve_roads = False
preserve_buildings = False
landmark_type = POI
landmark_offset = 0
add_lights = False

[ALTITUDE_ADJUSTMENT]
altitude_adjustment = 0

[AUTOMATIC_BUILD]
build_package_enabled = True

[BACKUP]
backup_enabled = True

[HEIGHT_MAPS]
height_adjustment = -1
ground_filter_size = 40
blend_outer_edges = True
flat_water_level = True

[TEXTURES]
resize_ratio = 0.5
# colors of the textures downloaded with TileDownloader (landmark tool), like its options: 1 = unchanged, hue 0 = unchanged.
# Use the values of the tiles download, so that the landmarks match the tiles
red_level = 1
green_level = 1
blue_level = 1
brightness = 0.85
contrast = 1
saturation = 1
hue = 0

[LANDMARKS]
# most detailed lod level kept by the tiles when upgrading the landmarks (landmarks.txt)
tiles_max_lod_level = 19

[SHADOW_LIGHTENING]
# step 2b, shadow lightening of the textures (the capture sun baked in): the shaded side of walls, roofs and trees brightened
# up to the lit side (at most x wall_gain_cap, vegetation at vegetation_strength), the cast shadows partly lifted (gain to the
# power shadow_strength, shadow_color of the shadows' color shift, at most x shadow_gain_cap, vegetation at
# shadow_vegetation_strength). sun_candidates: the capture suns as azimuth/elevation, ... (empty: estimated from the tiles)
wall_gain_cap = 3
vegetation_strength = 0.9
shadow_strength = 0.6
shadow_color = 0.5
shadow_gain_cap = 6
shadow_vegetation_strength = 0.5
sun_candidates = 
