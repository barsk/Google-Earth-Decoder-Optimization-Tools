site_name: GEDOT for MSFS 2024

# Copyright
copyright: Copyright &copy; 2022 - 2023 Thalixte, 2026 barsk. GNU GPL v2 or later

# Repository
repo_name: Google-Earth-Decoder-Optimization-Tools
repo_url: https://github.com/barsk/Google-Earth-Decoder-Optimization-Tools
edit_uri: edit/main/docs/

extra_javascript:
  - javascripts/open_in_new_tab.js
  - javascripts/jquery.min.js
  - javascripts/img-slider.js

extra_css:
  - stylesheets/bootstrap.min.css
  - stylesheets/extra.css

# Configuration
theme:
  name: material
  logo: assets/images/logo.png
  language: en
  features:
    - announce.dismiss
#    - content.action.edit
    - content.action.view
    # - content.code.annotate
    - content.code.copy
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    # - navigation.prune
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    # - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.png
  icon:
    logo: logo
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: barsk
      repo: Google-Earth-Decoder-Optimization-Tools
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - glightbox:
      skip_classes:
        - md-video
        - md-badge
  - mkdocs-video:
      is_video: True
      video_autoplay: True
      video_muted: True
      video_controls: True
      css_style:
        width: "100%"

# Page tree
nav:
  - Presentation: index.md
  - Getting started:
    - Prerequisites: installation/prerequisites.md
    - Installation: installation/installation.md
    - Local OpenStreetMap server: installation/openstreetmap-server.md
    - Workflow: workflow.md
  - Steps:
    - 1. Initialize: steps/1-initialize.md
    - 2. Optimize: steps/2-optimize.md
    - Landmarks and points of interest: steps/landmarks.md
    - 2a. Colour correction: steps/2a-colour-correction.md
    - 2b. Shadow lightening: steps/2b-shadow-lightening.md
    - 3. Polygons: steps/3-polygons.md
    - 4. Trim: steps/4-trim.md
    - 5. Height data: steps/5-height-data.md
    - 6. Finalize: steps/6-finalize.md
    - 7. Colliders: steps/7-colliders.md
    - Build: steps/build.md
  - Other tools: tools.md
  - Settings: settings.md
  - The optional tile downloader: tile-downloader.md
